# The Computer Use MCP application: a standalone profile composed from this one
# insert over the empty profile root. No model turn ever runs here, so the
# composition carries no model adapter, prompt-side tools, telemetry, or
# session-management rows; stdout belongs exclusively to MCP JSON-RPC, and one
# stdio connection owns one Agent whose cua_run_code programs retain state until
# the client disconnects or calls cua_reset.
#
# Row ids match dsh-base where the plugin is the same, so a profile or home
# cordis.patch.yml written for a base-backed profile addresses them unchanged.

[[entry]]
    # Sessions: the connection Agent's Session log (nested tool/ptc-dispatch events
    # and screenshots) and the projections that approval, sandbox policy, and the
    # Agent registry derive from it.
[[entry.insert]]
id = "session"
name = "@deepseek-ai/dsh-session"

[[entry.insert]]
id = "session-persistence-jsonl"
name = "@deepseek-ai/dsh-session-persistence-jsonl"

[entry.insert.config]
root = "js:dshHomePath('sessions')"

[[entry.insert]]
id = "session-projection"
name = "@deepseek-ai/dsh-session-projection"

[[entry.insert]]
id = "attachment-local"
name = "@deepseek-ai/dsh-attachment-local"

[[entry.insert]]
id = "working-directory"
name = "@deepseek-ai/dsh-working-directory"

    # Durable KV storage for the provider's application grants.
[[entry.insert]]
id = "storage"
name = "@deepseek-ai/dsh-storage"

[[entry.insert]]
id = "storage-json"
name = "@deepseek-ai/dsh-storage-json"

[entry.insert.config]
root = "js:dshHomePath('storages')"

[[entry.insert]]
id = "storage-domain"
name = "@deepseek-ai/dsh-storage-domain"

[entry.insert.config]
backend = "json"

    # Program processes: the dedicated CUA runtime launches under the same
    # file-effect boundary as every shipped CLI mode. A program's workspace-write
    # root is its Agent's working directory, which the cua-mcp row sets to the
    # workspace below; this row's root covers calls without a Session.
[[entry.insert]]
id = "subprocess"
name = "@deepseek-ai/dsh-subprocess-local"

[[entry.insert]]
id = "sandbox"
name = "@deepseek-ai/dsh-sandbox-local"

[[entry.insert]]
id = "sandbox-policy"
name = "@deepseek-ai/dsh-sandbox-policy"

[entry.insert.config]
mode = "js:process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
workspaceRoot = "js:process.env.DSH_CUA_WORKSPACE ?? dshHomePath('cua-mcp', 'workspace')"

[[entry.insert]]
id = "approval"
name = "@deepseek-ai/dsh-user-approval"

[entry.insert.config]
policy = "js:(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

[[entry.insert]]
id = "fs-sandbox"
name = "@deepseek-ai/dsh-fs-sandbox"

    # Tool execution and the Agent that owns the connection.
[[entry.insert]]
id = "tools"
name = "@deepseek-ai/dsh-tools"

[[entry.insert]]
id = "tool-executor-native"
name = "@deepseek-ai/dsh-tool-executor-native"

[[entry.insert]]
id = "system-prompt"
name = "@deepseek-ai/dsh-system-prompt"

[entry.insert.config]
personaPrefix = ""

[[entry.insert]]
id = "user-questions"
name = "@deepseek-ai/dsh-user-questions"

    # The Agent registry creates the connection Agent through the agent-loop
    # factory; no model adapter is mounted on the llm hub, so no turn can run.
[[entry.insert]]
id = "llm"
name = "@deepseek-ai/dsh-llm"

[[entry.insert]]
id = "agent"
name = "@deepseek-ai/dsh-agent"

[[entry.insert]]
id = "agent-loop"
name = "@deepseek-ai/dsh-agent-loop"

[entry.insert.config]
agents = []

    # A composed preset selects cua_run_code for the connection's Agent; the
    # empty preset keeps every model-facing row out of this profile.
[[entry.insert]]
id = "cua-mcp-presets"
name = "@deepseek-ai/dsh-agent-preset-registry"

[entry.insert.config]
default = "cua-mcp"

[[entry.insert]]
id = "cua-mcp-preset"
name = "@deepseek-ai/dsh-agent-preset"

[entry.insert.config]
id = "cua-mcp"
plugins = []

[[entry.insert]]
id = "cua-mcp-computer-use"
name = "@deepseek-ai/dsh-computer-use"

    # One native provider per Host: macOS, and native Windows (not WSL). Both
    # are optional dependencies that an installation on another platform can
    # lack, so each row is disabled off its own Host.
    # Screenshots target a fixed request image because no model route exists here.
[[entry.insert]]
id = "cua-mcp-provider"
name = "@deepseek-ai/dsh-cua-macos"
disabled = "js:process.platform !== 'darwin'"

[entry.insert.config]
agentPreset = "ptc"

[entry.insert.config.screenshotTarget]
longEdge = 2048
maxBytes = 2097152

[[entry.insert]]
id = "cua-mcp-provider-windows"
name = "@deepseek-ai/dsh-cua-windows"
disabled = "js:process.platform !== 'win32'"

[entry.insert.config]
agentPreset = "ptc"

[entry.insert.config.screenshotTarget]
longEdge = 2048
maxBytes = 2097152

    # DSH_CUA_CONSENT=allow grants application and pointer access without a human;
    # the default forwards each request to the MCP client as an elicitation.
    # DSH_CUA_WORKSPACE is the directory programs start in and may write under
    # workspace-write; the default stays inside the Harness home whatever
    # directory the client started the server in.
[[entry.insert]]
id = "cua-mcp"
name = "@deepseek-ai/dsh-cua-mcp"

[entry.insert.config]
consent = "js:process.env.DSH_CUA_CONSENT ?? 'elicit'"
workspace = "js:process.env.DSH_CUA_WORKSPACE ?? dshHomePath('cua-mcp', 'workspace')"

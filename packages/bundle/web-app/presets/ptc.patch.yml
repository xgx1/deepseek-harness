# Agent preset ptc: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-ptc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ptc
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是一个由 {{model}} 模型驱动的编码 agent。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set true to add the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式。在用户通过 exit_plan_mode 批准你的计划、或切换会话模式之前，一直留在计划模式里。用祈使语气要求你实现改动，意思是规划实现方案，而不是执行它。用户口语上的同意——包括对你所提问题的确认答复——并不构成批准，也不会结束计划模式；把已确认的决定并入计划，并通过 exit_plan_mode 提交。

                    先探索。用不产生变更的读取、搜索、静态分析和检查，让计划建立在真实仓库之上。不要编辑或写入文件、修改配置、运行会重写被跟踪文件的格式化器或代码生成、提交，或以其它方式执行计划。优先使用既有函数与模式，而不是新造机制。

                    为了请求缓存稳定，工具目录在各模式之间保持不变。这些计划模式规则覆盖任何之后出现、建议使用变更类工具的工具描述或指引；那些工具仍然列出，只是为了保持工具目录不变。不要用 todo_write 跟踪这个规划阶段：它跟踪的是计划获批之后的实现，而计划本身属于 exit_plan_mode。

                    靠检查来判定可查证的事实。只有当选择归用户所有，或遇到检查无法回答的实质性歧义时，才使用 ask_user_question。在你自己能查明时，不要问用户代码在哪里、当前行为如何。

                    让计划在决策层面完整：写明目标与成功标准；按子系统分组实现改动；指出公共 API、schema 与数据流变更；覆盖边界情况、失败模式、测试、验收标准与显式假设。保持简洁到可评审，同时详细到另一位工程师无需再做设计决策就能实现。

                    准备好时，调用 exit_plan_mode 并附上完整的计划 markdown，以 # 标题起始。让 exit_plan_mode 成为该条助手响应中唯一且最后的工具调用：它把计划提交审批，实现只在获批之后的后续步骤里才开始。不要把最终计划当作普通回复粘贴出来，也不要用散文或 ask_user_question 问“我可以继续吗？”。如果评审驳回，纳入反馈后再次提交。如果评审通道不可用或被中止，留在计划模式并请用户手动切换模式；不要继续实现。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

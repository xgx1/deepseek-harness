# Agent preset minimal: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: minimal
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是一个乐于助人的软件工程师助手。
              complete: true
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              readImage: true
              write: false
              edit: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    在 bash shell 里运行命令
                    * 调用本工具时，“command” 参数的内容不需要做 XML 转义。
                    * 网络访问取决于任务环境。可用时优先使用已配置的镜像/代理。
                    * 状态在多次命令调用和与用户的讨论之间保持持久。
                    * 要查看文件的某个行区间（例如第 10-25 行），可试 'sed -n 10,25p /path/to/the/file'。
                    * 请避免可能产生极大量输出的命令。
                    * 请把长期运行的命令放到后台执行，例如 'sleep 10 &'，或在后台启动服务。
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    在 PowerShell shell 里运行命令
                    * 调用本工具时，“command” 参数的内容不需要做 XML 转义。
                    * 通过本工具无法访问互联网。
                    * 状态在多次命令调用和与用户的讨论之间保持持久。
                    * 使用原生 Windows 路径（C:\...）和 $env:NAME 变量；这是 PowerShell，不是 bash。
                    * 请避免可能产生极大量输出的命令。
                    * 请把长期运行的命令放到后台执行，例如 'Start-Job'，或用 Start-Process 启动服务。

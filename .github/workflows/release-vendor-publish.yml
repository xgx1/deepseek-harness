# Publish the vendored framework sequence to npm. This workflow is manual-only
# (workflow_dispatch) and intentionally does not listen to pull_request or push:
# publication must always be an explicit, reviewed act from a vendor-* tag, and
# it must never appear as a PR check. It repacks the current tree before
# publishing so the bytes uploaded are exactly what this dispatch produced.
name: Release publish (vendor)

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: Optional unused npm channel. Leave empty for latest (stable) or next (prerelease).
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: nubjs/setup-nub@v0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: nub ci

      - name: Verify release version
        env:
          RELEASE_PUBLISH: 'true'
        run: nub run release:verify --family vendor

      # The vendored packages publish their own sources and build outputs; the
      # host build produces what their manifests select.
      - name: Build
        run: nub run build:lib:host

      - name: Pack release tarballs
        run: nub run release:pack --family vendor --out dist/npm-vendor

      - name: Verify packed install
        run: nub run release:verify-packed-install --family vendor --from dist/npm-vendor

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vendor-npm-tarballs
          path: dist/npm-vendor/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Checkout and install carry the release scripts only; no build step.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: nubjs/setup-nub@v0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install (immutable, no package scripts)
        run: nub ci --ignore-scripts

      - uses: actions/download-artifact@v8.0.1
        with:
          name: vendor-npm-tarballs
          path: dist/npm-vendor

      - name: Publish tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_DIST_TAG" ]]; then
            args+=(--dist-tag "$RELEASE_DIST_TAG")
          fi
          nub run release:publish --family vendor --from dist/npm-vendor "${args[@]}"
